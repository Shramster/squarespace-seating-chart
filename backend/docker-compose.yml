name: seatchart-ticketing

services:
  web:
    build: .
    command: sh /code/start.sh
    env_file:
      - .env
    volumes:
      - .:/code
      - ../dist:/dist
    ports:
      - "${PORT:-8100}:8000"

  poller:
    build: .
    command: python manage.py poll_squarespace_orders
    env_file:
      - .env
    volumes:
      - .:/code
    profiles:
      - poller
    restart: unless-stopped

  inventory-poller:
    build: .
    command: python manage.py poll_squarespace_inventory
    env_file:
      - .env
    volumes:
      - .:/code
    profiles:
      - poller
    restart: unless-stopped
