# Overlay for `make dev-lan` — adds the LAN IP to the hosts/origins Django
# will accept, on top of the defaults in docker-compose.yml/.env. Requires
# LAN_IP to be set in the environment (the Makefile sets it).
services:
  web:
    environment:
      - DJANGO_ALLOWED_HOSTS=127.0.0.1,localhost,${LAN_IP}
      - CORS_ALLOWED_ORIGINS=http://127.0.0.1:3000,http://${LAN_IP}:3000
